name: Monday release

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: One line for versions/latest.json
        required: true
        type: string
      release_notes:
        description: Optional. 3 to 6 short lines for the owner, separated by |
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Publish the Monday release
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Write the versions folder
        run: |
          python3 versions_release.py \
            --repo . \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --changelog "${{ github.event.inputs.changelog }}" \
            --source-commit "$(git rev-parse --short HEAD)" \
            --notes "${{ github.event.inputs.release_notes }}"

      - name: Tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 version.py)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions/latest.json
          git commit -m "Release ${version}"
          git push
          git tag "v${version}"
          git push origin "v${version}"
          gh release create "v${version}" --title "v${version}" --notes-file versions/latest.json
